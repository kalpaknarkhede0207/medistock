services:
  - type: web
    name: medistock-ocr-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK
        value: "True"
